<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<title>竞彩足球 2串1 一键生成</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #1a1d24;
    --sub: #6b7280;
    --line: #e6e8ec;
    --brand: #0a84ff;
    --brand-ink: #ffffff;
    --goals: #0a7d33;
    --half: #b45309;
    --ok: #0a7d33;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: 76px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 12px; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(135deg, #0a84ff, #0060df);
    color: #fff; padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: .9; }

  .toolbar {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin: 12px 0;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .toolbar .field { display: flex; align-items: center; gap: 6px; }
  .toolbar label { font-size: 13px; color: var(--sub); white-space: nowrap; }
  .toolbar input, .toolbar select {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 8px; font-size: 14px; background: #fff; color: var(--ink);
  }
  .toolbar input { width: 70px; }
  .toolbar select { max-width: 130px; }

  .btn {
    border: none; border-radius: 10px; padding: 10px 14px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--brand); color: var(--brand-ink);
  }
  .btn:active { opacity: .85; }
  .btn.secondary { background: #eef1f5; color: var(--ink); }
  .btn.block { width: 100%; }

  .status {
    border-radius: 12px; padding: 12px; margin: 12px 0;
    font-size: 14px; background: #fff; border: 1px solid var(--line);
  }
  .status.loading { color: var(--brand); }
  .status.error { color: var(--danger); background: #fef2f2; border-color: #fecaca; }
  .status.ok { color: var(--ok); }
  .status.empty { color: var(--sub); text-align: center; }

  .section-title {
    font-size: 15px; font-weight: 700; margin: 16px 0 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-title .cnt { font-weight: 500; font-size: 12px; color: var(--sub); }

  .match-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 10px;
  }
  .match-head { display: flex; align-items: center; gap: 8px; }
  .match-num { font-weight: 700; font-size: 14px; color: var(--brand); }
  .match-league {
    font-size: 12px; color: #fff; background: #334155;
    border-radius: 6px; padding: 2px 8px;
  }
  .match-time { margin-left: auto; font-size: 12px; color: var(--sub); }
  .match-teams { font-size: 15px; font-weight: 600; margin: 8px 0 2px; }
  .match-date { font-size: 12px; color: var(--sub); }

  .play-group { margin-top: 10px; }
  .play-label { font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .play-label.goals { color: var(--goals); font-weight: 600; }
  .play-label.half { color: var(--half); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 5px 10px; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip em { font-style: normal; color: var(--sub); font-size: 12px; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .chip.on em { color: rgba(255,255,255,.85); }

  .empty-mini { color: var(--sub); font-size: 13px; }

  .combo-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 10px;
  }
  .combo-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 3px 8px; color: #fff; }
  .badge.t1 { background: var(--goals); }
  .badge.t2 { background: #7c3aed; }
  .badge.t3 { background: #db2777; }
  .badge.t4 { background: var(--half); }
  .badge.profit { background: var(--ok); }
  .combo-idx { font-weight: 700; color: var(--sub); font-size: 13px; }
  .leg { border-left: 3px solid var(--line); padding: 4px 0 4px 10px; margin: 6px 0; }
  .leg.goals { border-left-color: var(--goals); }
  .leg.half { border-left-color: var(--half); }
  .leg .t { font-weight: 600; font-size: 14px; }
  .leg .p { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .leg .p b { color: var(--ink); font-weight: 600; }
  .combo-metrics {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line);
    font-size: 13px; color: var(--sub);
  }
  .combo-metrics b { color: var(--ink); font-weight: 700; }

  .floating {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #fff; border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 10px;
  }
  .floating .btn { flex: 1; }

  .note { font-size: 12px; color: var(--sub); margin: 12px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>竞彩足球 · 2串1 一键生成</h1>
  <p>同步体彩官方赛事与赔率 · 自动套用预设方案 · 手机出票助手</p>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="field">
      <label for="threshold">筛选值≥</label>
      <input id="threshold" type="number" min="0" max="200" step="1" value="20">
      <label for="threshold">%</label>
    </div>
    <button class="btn" id="btnGen">生成方案</button>
    <button class="btn secondary" id="btnRefresh">刷新数据</button>
  </div>

  <div id="status" class="status loading">正在同步体彩数据…</div>

  <div class="section-title">当日赛事 <span class="cnt" id="matchCnt"></span></div>
  <div id="matches"></div>

  <div class="section-title">生成结果 <span class="cnt" id="resultCnt"></span></div>
  <div id="results"></div>

  <p class="note">说明：长期赔率乘积 = 两场“长期赔率”（历史文档预设场均赔率）相乘；总投入 = 总注数 × 2元。仅展示当日赛事（今日11:00至次日11:00开赛）。仅用于投注方案整理，不构成任何购彩建议。</p>
</div>

<div class="floating hidden" id="floatBar">
  <button class="btn" id="btnCopy">复制文字注单</button>
  <button class="btn secondary" id="btnScrollTop">回顶部</button>
</div>

<script>
(function () {
  "use strict";

  // ---------- 玩法定义 ----------
  var GOAL_KEYS = ["s0","s1","s2","s3","s4","s5","s6","s7"];
  var GOAL_LABELS = ["0球","1球","2球","3球","4球","5球","6球","7+球"];
  var HALF_KEYS = ["hh","hd","ha","dh","dd","da","ah","ad","aa"];
  var HALF_LABELS = ["胜胜","胜平","胜负","平胜","平平","平负","负胜","负平","负负"];

  // ---------- 文档预设选择项（联赛短名 → 选项） ----------
  // ====AUTO:PRESET:START====
  var PRESET = {
    "挪超":   { goals: [],                    half: ["胜胜","负负"] },
    "芬超":   { goals: [],                    half: ["胜胜","平胜","负负"] },
    "瑞超":   { goals: ["0球","2球","3球","4球"], half: ["胜胜","平平","平负","负负"] },
    "葡超":   { goals: ["1球","2球","4球"],      half: [] },
    "西甲":   { goals: ["2球","3球","4球"],      half: ["平胜","胜平","平平"] },
    "荷甲":   { goals: ["3球","4球","5球"],      half: ["胜胜","平胜","负负"] },
    "荷乙":   { goals: ["1球","3球","4球","5球"], half: ["胜胜","平胜","负平","胜负"] },
    "法乙":   { goals: ["1球","2球","4球","6球"], half: ["胜胜","平平","平负","负负"] },
    "英联赛杯": { goals: ["1球","2球","4球"],      half: ["胜胜","平胜","平平","负负"] },
    "英社区盾": { goals: ["3球"],                half: ["胜胜"] },
    "德乙":   { goals: [],                    half: ["胜胜","平平","负平","负负"] },
    "欧冠":   { goals: [],                    half: ["胜胜","平胜","平平","平负","负负"] },
    "欧罗巴":  { goals: ["2球","3球","5球"],      half: ["胜胜","平胜","胜平","平负"] },
    "英冠":   { goals: ["0球","2球","3球","4球"], half: ["胜胜","平平","负平","平负"] },
    "巴甲":   { goals: ["0球","2球"],           half: ["胜胜","胜平","平平"] },
    "巴西杯":  { goals: ["2球","4球"],           half: ["胜胜","胜平","平平"] },
    "解放者杯": { goals: ["1球","2球","3球"],      half: ["胜胜","平胜","胜平","平平","平负"] },
    "美职":   { goals: ["0球","2球","5球"],      half: ["平胜","平平","负平"] },
    "韩职":   { goals: ["0球","3球","4球","5球"], half: ["胜胜","平平","负负"] },
    "日职":   { goals: ["3球","4球","5球"],      half: ["胜胜","平平","胜负"] },
    "日乙":   { goals: ["0球","1球","2球","4球"], half: ["胜胜","负负","平平"] },
    "亚冠精英": { goals: ["0球","1球","2球","3球"], half: ["胜胜","平胜","负胜","平平","负负"] },
    "沙职":   { goals: [],                    half: ["胜胜","胜平","平胜","平负"] },
  };
  // ====AUTO:PRESET:END====

  // ---------- 文档长期赔率（联赛短名 → 各玩法历史场均赔率） ----------
  // ====AUTO:LONG_ODDS:START====
  var LONG_ODDS = {
    "挪超":   { goals: 0.00, half: 3.25 },
    "芬超":   { goals: 0.00, half: 4.22 },
    "瑞超":   { goals: 3.91, half: 4.66 },
    "葡超":   { goals: 3.89, half: 0.00 },
    "西甲":   { goals: 4.00, half: 5.55 },
    "荷甲":   { goals: 5.04, half: 4.16 },
    "荷乙":   { goals: 4.18, half: 4.28 },
    "法乙":   { goals: 4.16, half: 3.88 },
    "英联赛杯": { goals: 4.74, half: 3.59 },
    "英社区盾": { goals: 3.90, half: 4.60 },
    "德乙":   { goals: 0.00, half: 4.41 },
    "欧冠":   { goals: 0.00, half: 4.63 },
    "欧罗巴":  { goals: 3.76, half: 4.61 },
    "英冠":   { goals: 4.35, half: 5.00 },
    "巴甲":   { goals: 3.31, half: 3.62 },
    "巴西杯":  { goals: 3.18, half: 4.01 },
    "解放者杯": { goals: 3.44, half: 6.71 },
    "美职":   { goals: 4.04, half: 5.22 },
    "韩职":   { goals: 4.13, half: 4.99 },
    "日职":   { goals: 3.66, half: 4.22 },
    "日乙":   { goals: 4.08, half: 3.93 },
    "亚冠精英": { goals: 3.12, half: 6.70 },
    "沙职":   { goals: 0.00, half: 3.47 },
  };
  // ====AUTO:LONG_ODDS:END====

  var API_URL = "https://webapi.sporttery.cn/gateway/jc/football/getMatchCalculatorV1.qry?poolCode=ttg,hafu&channel=c";

  var MATCHES = [];
  var LAST_UPDATE = "";
  var LAST_COMBOS = [];

  var $ = function (id) { return document.getElementById(id); };

  function parseOdds(v) {
    if (v === undefined || v === null || v === "") return null;
    var f = parseFloat(v);
    return (isFinite(f) && f > 0) ? f : null;
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function beijingNow() {
    var d = new Date();
    return new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 8 * 3600000);
  }

  function beijingDateStr(d) {
    return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
  }

  function buildOptions(pool, keys, labels) {
    if (!pool) return [];
    var out = [];
    for (var i = 0; i < keys.length; i++) {
      var odds = parseOdds(pool[keys[i]]);
      if (odds !== null) {
        out.push({ key: keys[i], label: labels[i], odds: odds, checked: false });
      }
    }
    return out;
  }

  function teamName(short, full) {
    return full || short || "";
  }

  function setStatus(cls, msg) {
    var el = $("status");
    el.className = "status " + cls;
    el.textContent = msg;
  }

  function loadData() {
    setStatus("loading", "正在同步体彩数据…");
    fetch(API_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data || data.success !== true) {
          throw new Error((data && data.errorMessage) || "接口返回异常");
        }
        parseData(data);
      })
      .catch(function (err) {
        setStatus("error", "数据同步失败：" + err.message + "（可点击“刷新数据”重试）");
        $("matches").innerHTML = "";
        $("results").innerHTML = "";
        $("matchCnt").textContent = "";
        $("resultCnt").textContent = "";
      });
  }

  function parseData(data) {
    var value = data.value || {};
    var list = [];
    var infoList = value.matchInfoList || [];
    var bjNow = beijingNow();
    var todayStr = beijingDateStr(bjNow);
    var tomorrowStr = beijingDateStr(new Date(bjNow.getTime() + 24 * 3600000));
    var windowStart = new Date(todayStr + "T11:00:00+08:00").getTime();
    var windowEnd = new Date(tomorrowStr + "T11:00:00+08:00").getTime();
    for (var i = 0; i < infoList.length; i++) {
      var subs = infoList[i].subMatchList || [];
      for (var j = 0; j < subs.length; j++) {
        var sm = subs[j];
        if (sm.matchStatus !== "Selling") continue;
        var kick = new Date((sm.matchDate || "") + "T" + (sm.matchTime || "") + "+08:00").getTime();
        if (!isFinite(kick) || kick < windowStart || kick >= windowEnd) continue;
        var goals = buildOptions(sm.ttg, GOAL_KEYS, GOAL_LABELS);
        var half = buildOptions(sm.hafu, HALF_KEYS, HALF_LABELS);
        if (goals.length === 0 && half.length === 0) continue;
        list.push({
          matchId: sm.matchId,
          matchNumStr: sm.matchNumStr || "",
          leagueAbbName: sm.leagueAbbName || "",
          leagueAllName: sm.leagueAllName || "",
          home: teamName(sm.homeTeamAbbName, sm.homeTeamAllName),
          away: teamName(sm.awayTeamAbbName, sm.awayTeamAllName),
          matchTime: sm.matchTime || "",
          matchDate: sm.matchDate || "",
          matchWeek: sm.matchWeek || "",
          goalsOptions: goals,
          halfOptions: half
        });
      }
    }
    MATCHES = list;
    LAST_UPDATE = value.lastUpdateTime || "";
    applyPresets();
    renderMatches();
    generate();
    setStatus("ok", "数据已同步" + (LAST_UPDATE ? "（更新时间 " + LAST_UPDATE + "）" : "") + "，共 " + MATCHES.length + " 场当日可投注赛事。");
  }

  function applyPresets() {
    for (var i = 0; i < MATCHES.length; i++) {
      var m = MATCHES[i];
      var p = PRESET[m.leagueAbbName];
      if (!p) continue;
      for (var a = 0; a < p.goals.length; a++) {
        var g = m.goalsOptions.filter(function (o) { return o.label === p.goals[a]; })[0];
        if (g) g.checked = true;
      }
      for (var b = 0; b < p.half.length; b++) {
        var h = m.halfOptions.filter(function (o) { return o.label === p.half[b]; })[0];
        if (h) h.checked = true;
      }
    }
  }

  function renderMatches() {
    var wrap = $("matches");
    $("matchCnt").textContent = MATCHES.length ? "共 " + MATCHES.length + " 场当日赛事" : "";
    if (!MATCHES.length) {
      wrap.innerHTML = '<div class="status empty">当日暂无可投注赛事（今日11:00至次日11:00）</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < MATCHES.length; i++) {
      var m = MATCHES[i];
      html += '<div class="match-card">';
      html += '  <div class="match-head">';
      html += '    <span class="match-num">' + esc(m.matchNumStr) + '</span>';
      html += '    <span class="match-league">' + esc(m.leagueAbbName || m.leagueAllName) + '</span>';
      html += '    <span class="match-time">' + esc(m.matchWeek + " " + m.matchTime) + '</span>';
      html += '  </div>';
      html += '  <div class="match-teams">' + esc(m.home) + ' vs ' + esc(m.away) + '</div>';
      html += '  <div class="match-date">' + esc(m.matchDate) + '</div>';

      html += '  <div class="play-group">';
      html += '    <div class="play-label goals">进球数（总进球）</div>';
      if (m.goalsOptions.length) {
        html += '    <div class="chips">' + renderChips(i, "goals", m.goalsOptions) + '</div>';
      } else {
        html += '    <div class="empty-mini">暂无此玩法</div>';
      }
      html += '  </div>';

      html += '  <div class="play-group">';
      html += '    <div class="play-label half">半全场</div>';
      if (m.halfOptions.length) {
        html += '    <div class="chips">' + renderChips(i, "half", m.halfOptions) + '</div>';
      } else {
        html += '    <div class="empty-mini">暂无此玩法</div>';
      }
      html += '  </div>';

      html += '</div>';
    }
    wrap.innerHTML = html;
  }

  function renderChips(mi, play, options) {
    var s = "";
    for (var k = 0; k < options.length; k++) {
      var o = options[k];
      s += '<button type="button" class="chip' + (o.checked ? ' on' : '') + '" data-mi="' + mi + '" data-play="' + play + '" data-key="' + o.key + '">'
        + esc(o.label) + ' <em>' + o.odds.toFixed(2) + '</em></button>';
    }
    return s;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // 事件委托：点击选项 chip 切换勾选
  $("matches").addEventListener("click", function (e) {
    var chip = e.target.closest ? e.target.closest(".chip") : null;
    if (!chip) return;
    var mi = parseInt(chip.getAttribute("data-mi"), 10);
    var play = chip.getAttribute("data-play");
    var key = chip.getAttribute("data-key");
    var m = MATCHES[mi];
    if (!m) return;
    var arr = play === "goals" ? m.goalsOptions : m.halfOptions;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].key === key) {
        arr[i].checked = !arr[i].checked;
        chip.classList.toggle("on", arr[i].checked);
        break;
      }
    }
  });

  function playName(play) {
    return play === "goals" ? "进球数（总进球）" : "半全场";
  }

  function typeOf(a, b) {
    if (a.play === "goals" && b.play === "goals") return { key: "t1", name: "进球数 × 进球数" };
    if (a.play === "goals" && b.play === "half") return { key: "t2", name: "进球数 × 半全场" };
    if (a.play === "half" && b.play === "goals") return { key: "t3", name: "半全场 × 进球数" };
    return { key: "t4", name: "半全场 × 半全场" };
  }

  function makeLeg(m, play, opts) {
    var sum = 0, min = Infinity, max = -Infinity;
    for (var i = 0; i < opts.length; i++) {
      sum += opts[i].odds;
      if (opts[i].odds < min) min = opts[i].odds;
      if (opts[i].odds > max) max = opts[i].odds;
    }
    var avg = sum / opts.length;
    var longOdds = avg;
    var lo = LONG_ODDS[m.leagueAbbName];
    if (lo) {
      var v = play === "goals" ? lo.goals : lo.half;
      if (v > 0) longOdds = v;
    }
    return {
      matchId: m.matchId,
      matchNumStr: m.matchNumStr,
      home: m.home,
      away: m.away,
      league: m.leagueAbbName || m.leagueAllName,
      play: play,
      opts: opts,
      avg: avg,
      longOdds: longOdds,
      count: opts.length,
      min: min,
      max: max
    };
  }

  function generate() {
    var threshold = getThreshold();
    var legs = [];
    for (var i = 0; i < MATCHES.length; i++) {
      var m = MATCHES[i];
      var gs = m.goalsOptions.filter(function (o) { return o.checked; });
      var hs = m.halfOptions.filter(function (o) { return o.checked; });
      if (gs.length) legs.push(makeLeg(m, "goals", gs));
      if (hs.length) legs.push(makeLeg(m, "half", hs));
    }

    var combos = [];
    for (var a = 0; a < legs.length; a++) {
      for (var b = a + 1; b < legs.length; b++) {
        if (legs[a].matchId === legs[b].matchId) continue; // 同一场比赛不能组成2串1
        var A = legs[a], B = legs[b];
        var product = A.longOdds * B.longOdds;
        var bets = A.count * B.count;
        var invest = bets * 2;
        var prize = 2 * product;
        var profit = prize / invest - 1;
        var minPrize = 2 * A.min * B.min;
        var maxPrize = 2 * A.max * B.max;
        var type = typeOf(A, B);
        combos.push({
          a: A, b: B,
          type: type,
          product: product,
          bets: bets,
          invest: invest,
          prize: prize,
          profit: profit,
          minPrize: minPrize,
          maxPrize: maxPrize
        });
      }
    }

    var filtered = combos.filter(function (c) { return c.profit >= threshold; });
    filtered.sort(function (x, y) {
      if (y.product !== x.product) return y.product - x.product;
      return y.profit - x.profit;
    });

    LAST_COMBOS = filtered;
    renderResults(filtered, combos.length, threshold);
  }

  function getThreshold() {
    var v = parseFloat($("threshold").value);
    if (!isFinite(v)) v = 20;
    if (v < 0) v = 0;
    return v / 100;
  }

  function renderResults(combos, total, threshold) {
    var wrap = $("results");
    var pct = Math.round(threshold * 100);
    if (!combos.length) {
      $("resultCnt").textContent = "";
      wrap.innerHTML = '<div class="status empty">当日无可投注方案（无组合满足筛选值 ≥ ' + pct + '%）</div>';
      $("floatBar").classList.add("hidden");
      return;
    }
    $("resultCnt").textContent = "共 " + combos.length + " 个方案（已按筛选值 ≥ " + pct + "% 筛选）";
    var html = "";
    for (var i = 0; i < combos.length; i++) {
      html += renderCombo(i + 1, combos[i]);
    }
    wrap.innerHTML = html;
    $("floatBar").classList.remove("hidden");
  }

  function renderCombo(idx, c) {
    var html = '<div class="combo-card">';
    html += '  <div class="combo-top">';
    html += '    <span class="combo-idx">#' + idx + '</span>';
    html += '    <span class="badge ' + c.type.key + '">' + esc(c.type.name) + '</span>';
    html += '  </div>';
    html += renderLeg("A", c.a);
    html += renderLeg("B", c.b);
    html += '  <div class="combo-metrics">';
    html += '    <div>长期赔率乘积：<b>' + c.product.toFixed(2) + '</b></div>';
    html += '    <div>总注数：<b>' + c.bets + '</b> 倍数：<b>1</b></div>';
    html += '    <div>总投入：<b>' + c.invest.toFixed(0) + ' 元</b></div>';
    html += '    <div style="grid-column:1/-1">奖金区间：<b>最低 ' + c.minPrize.toFixed(2) + ' 元 ~ 最高 ' + c.maxPrize.toFixed(2) + ' 元</b></div>';
    html += '  </div>';
    html += '</div>';
    return html;
  }

  function renderLeg(tag, leg) {
    var opts = leg.opts.map(function (o) { return o.label + "(" + o.odds.toFixed(2) + ")"; }).join(" + ");
    var cls = leg.play === "goals" ? "goals" : "half";
    return '<div class="leg ' + cls + '">'
      + '<div class="t">' + tag + '. ' + esc(leg.matchNumStr) + ' ' + esc(leg.home) + ' vs ' + esc(leg.away) + '（' + esc(leg.league) + '）</div>'
      + '<div class="p"><b>' + playName(leg.play) + '</b> · ' + esc(opts) + '</div>'
      + '<div class="p">场均赔率 <b>' + leg.avg.toFixed(2) + '</b>（' + leg.count + ' 个选项）长期赔率 <b>' + leg.longOdds.toFixed(2) + '</b></div>'
      + '</div>';
  }

  function buildCopyText() {
    if (!LAST_COMBOS.length) return "";
    var pct = Math.round(getThreshold() * 100);
    var lines = [];
    lines.push("========== 竞彩足球 2串1 方案 ==========");
    lines.push("数据时间：" + (LAST_UPDATE || "未知"));
    lines.push("筛选条件：筛选值 ≥ " + pct + "%");
    lines.push("有效方案：" + LAST_COMBOS.length + " 个");
    lines.push("");
    for (var i = 0; i < LAST_COMBOS.length; i++) {
      var c = LAST_COMBOS[i];
      lines.push("【" + (i + 1) + "】" + c.type.name);
      lines.push("A. " + c.a.matchNumStr + " " + c.a.home + " vs " + c.a.away + "（" + c.a.league + "）");
      lines.push("   玩法：" + playName(c.a.play));
      lines.push("   选项：" + c.a.opts.map(function (o) { return o.label + "(" + o.odds.toFixed(2) + ")"; }).join(" + "));
      lines.push("   场均赔率：" + c.a.avg.toFixed(2) + "（" + c.a.count + " 个选项）长期赔率：" + c.a.longOdds.toFixed(2));
      lines.push("B. " + c.b.matchNumStr + " " + c.b.home + " vs " + c.b.away + "（" + c.b.league + "）");
      lines.push("   玩法：" + playName(c.b.play));
      lines.push("   选项：" + c.b.opts.map(function (o) { return o.label + "(" + o.odds.toFixed(2) + ")"; }).join(" + "));
      lines.push("   场均赔率：" + c.b.avg.toFixed(2) + "（" + c.b.count + " 个选项）长期赔率：" + c.b.longOdds.toFixed(2));
      lines.push("长期赔率乘积：" + c.product.toFixed(2) + " | 注数：" + c.bets + " | 倍数：1 | 投入：" + c.invest.toFixed(0) + "元");
      lines.push("奖金区间：最低 " + c.minPrize.toFixed(2) + " 元 ~ 最高 " + c.maxPrize.toFixed(2) + " 元");
      lines.push("----------------------------------------");
    }
    return lines.join("\n");
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function toast(msg) {
    var el = $("status");
    el.className = "status ok";
    el.textContent = msg;
  }

  $("btnGen").addEventListener("click", function () { generate(); });
  $("btnRefresh").addEventListener("click", function () { loadData(); });
  $("threshold").addEventListener("change", function () { generate(); });

  $("btnCopy").addEventListener("click", function () {
    var text = buildCopyText();
    if (!text) { toast("暂无方案可复制"); return; }
    copyText(text).then(function (ok) {
      toast(ok ? "注单已复制到剪贴板，请到体彩App/网页按内容出票" : "复制失败，请长按手动复制");
    });
  });

  $("btnScrollTop").addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });

  // 启动
  loadData();
})();
</script>
