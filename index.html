<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI智能投注 · 今日一键选单</title>
<style>
:root {
  --bg:#f0f2f5; --card:#fff; --red:#c62828; --gold:#e65100; --gold-bg:#fff3e0;
  --green:#1b5e20; --green-bg:#e8f5e9; --blue:#0d47a1; --blue-bg:#e3f2fd;
  --text:#222; --sub:#888; --border:#e0e0e0; --radius:10px; --shadow:0 2px 10px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;padding-bottom:80px}
.hidden{display:none!important}

/* 顶部 */
.topbar{background:linear-gradient(135deg,#b71c1c,#c62828);color:#fff;padding:16px 16px 20px}
.topbar h1{font-size:20px;font-weight:700}
.topbar h1 span{color:#ffcc02}
.topbar .date{font-size:12px;opacity:.8;margin-top:4px}
.topbar .badge-row{display:flex;gap:8px;margin-top:10px}
.topbar .badge{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:12px;font-size:11px}

/* 加载状态 */
.loading{text-align:center;padding:60px 20px;color:var(--sub)}
.loading .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 统计卡片 */
.stat-cards{display:flex;gap:8px;padding:12px 16px;margin-top:-8px}
.stat-card{flex:1;background:var(--card);border-radius:var(--radius);padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat-card .num{font-size:22px;font-weight:700}
.stat-card .lbl{font-size:10px;color:var(--sub);margin-top:2px}
.stat-card .num.gold{color:var(--gold)}
.stat-card .num.green{color:var(--green)}
.stat-card .num.red{color:var(--red)}

/* 空状态 */
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
.empty .icon{font-size:48px;margin-bottom:12px}
.empty h3{font-size:16px;color:var(--text);margin-bottom:8px}
.empty p{font-size:13px;line-height:1.6}

/* 赛事卡片 */
.match-card{background:var(--card);margin:8px 16px;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border-left:3px solid var(--gold)}
.match-card .m-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.match-card .m-league{font-size:11px;padding:2px 8px;border-radius:3px;font-weight:600}
.m-league.rec{background:var(--gold-bg);color:var(--gold)}
.m-league.skip{background:#fce4ec;color:#c62828}
.match-card .m-num{font-size:11px;color:var(--sub)}
.match-card .m-teams{font-size:15px;font-weight:700;text-align:center;margin:6px 0}
.match-card .m-teams .vs{color:var(--sub);margin:0 6px;font-weight:400}
.match-card .m-time{font-size:11px;color:var(--sub);text-align:center}

/* 投注项 */
.bet-section{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)}
.bet-section .bs-title{font-size:11px;color:var(--sub);margin-bottom:6px}
.bet-section .bs-title .roi{font-weight:700}
.bet-section .bs-title .roi.good{color:var(--green)}
.bet-section .bs-title .roi.bad{color:var(--red)}
.bet-options{display:flex;gap:4px;flex-wrap:wrap}
.bet-opt{background:#fafafa;border:1px solid var(--border);border-radius:16px;padding:5px 12px;font-size:12px;font-weight:600;transition:.15s}
.bet-opt.rec{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.bet-opt.rec::before{content:'★ ';font-size:10px}

/* 底部操作栏 */
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);padding:12px 16px;box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100;display:flex;align-items:center;gap:10px}
.bottom .total{font-size:13px;color:var(--sub)}
.bottom .total strong{font-size:18px;color:var(--red)}
.bottom button{flex:1;padding:12px;border:none;border-radius:24px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
.bottom .btn-refresh{flex:0;background:var(--bg);color:var(--text);padding:12px 16px;border-radius:24px;font-size:18px}
.bottom .btn-submit{background:var(--red);color:#fff;flex:2}
.bottom .btn-submit:active{background:#b71c1c}

/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-inner{background:var(--card);width:100%;max-width:500px;border-radius:16px 16px 0 0;padding:20px;max-height:80vh;overflow-y:auto}
.modal-inner h3{font-size:17px;text-align:center;margin-bottom:16px}
.ticket{border:2px dashed var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.ticket .t-title{text-align:center;font-weight:700;font-size:15px;margin-bottom:10px}
.ticket .t-item{font-size:12px;padding:5px 0;border-bottom:1px dotted var(--border);display:flex;justify-content:space-between}
.ticket .t-item .opts{color:var(--green);font-weight:600}
.ticket .t-total{text-align:right;font-weight:700;font-size:16px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.modal .btn-row{display:flex;gap:8px}
.modal .btn-row button{flex:1;padding:10px;border:none;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer}
.modal .btn-close{background:var(--bg);color:var(--text)}
.modal .btn-print{background:var(--red);color:#fff}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:300;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%)translateY(-10px)}to{opacity:1;transform:translateX(-50%)translateY(0)}}

/* 联赛映射 */
.league-tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;margin-right:4px}
</style>
</head>
<body>

<div class="topbar">
  <h1>⚽ AI<span>智能投注</span></h1>
  <div class="date" id="todayDate">加载中...</div>
  <div class="badge-row">
    <span class="badge">📊 8联赛AI模型</span>
    <span class="badge">🎯 历史ROI筛选</span>
    <span class="badge" id="apiBadge">🔄 实时数据</span>
  </div>
</div>

<div id="loadingView" class="loading">
  <div class="spinner"></div>
  <div>正在获取今日赛事数据...</div>
  <div style="font-size:11px;color:#aaa;margin-top:6px">来源：中国体彩官方API</div>
</div>

<div id="errorView" class="empty hidden">
  <div class="icon">📡</div>
  <h3>数据获取失败</h3>
  <p>无法连接体彩官方API<br>请检查网络后刷新重试</p>
  <button onclick="location.reload()" style="margin-top:16px;padding:10px 30px;background:var(--red);color:#fff;border:none;border-radius:20px;font-size:14px;font-weight:600;">刷新重试</button>
</div>

<div id="mainView" class="hidden">
  <div class="stat-cards" id="statCards"></div>
  <div class="empty hidden" id="emptyView">
    <div class="icon">🎯</div>
    <h3>今日无最佳投注赔率</h3>
    <p>今日开出的赛事中，无可匹配AI策略的联赛<br>（仅有 日职/韩职K2/英冠/荷乙 等未覆盖联赛）<br><br>建议：<strong>今日不投注</strong>，等待高ROI联赛出现</p>
  </div>
  <div id="matchList"></div>
</div>

<div class="bottom hidden" id="bottomBar">
  <button class="btn-refresh" onclick="location.reload()" title="刷新">🔄</button>
  <div class="total">今日投注 <strong id="totalCost">¥0</strong></div>
  <button class="btn-submit" onclick="showTicket()">📋 查看投注方案</button>
</div>

<div class="modal hidden" id="ticketModal">
  <div class="modal-inner" id="ticketContent"></div>
</div>
<div class="modal hidden" id="parlayModal">
  <div class="modal-inner" id="parlayContent"></div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
// ========== 8联赛AI策略引擎 ==========
const LEAGUE_MAP = {
  '瑞超': { alias:'瑞典超级联赛', goal:{combo:['0','2','3'],roi:36.8,cost:6}, half:{combo:['胜胜','平平','平负'],roi:-2.1,cost:6} },
  '美职': { alias:'美国职业大联盟', goal:{combo:['0','2'],roi:72.2,cost:4}, half:{combo:['平胜','平平','负平'],roi:63.9,cost:6} },
  '巴甲': { alias:'巴西甲级联赛', goal:{combo:['0','2'],roi:48.6,cost:4}, half:{combo:['胜胜','胜平','平平'],roi:50.9,cost:6} },
  '挪超': { alias:'挪威超级联赛', goal:{combo:['1','3'],roi:18.3,cost:4}, half:{combo:['胜胜','平负','负负'],roi:-8.2,cost:6} },
  '芬超': { alias:'芬兰超级联赛', goal:{combo:['1','3'],roi:18.3,cost:4}, half:{combo:['胜胜','平胜','负负'],roi:19.2,cost:6} },
  '欧罗巴': { alias:'欧罗巴联赛', goal:{combo:['2','3'],roi:8.0,cost:4}, half:{combo:['胜胜','负胜','平负'],roi:68.8,cost:6} },
  '欧冠': { alias:'欧洲冠军联赛', goal:{combo:['2','3'],roi:5.8,cost:4}, half:{combo:['胜胜','平胜','平负'],roi:-7.1,cost:6} },
  '韩职': { alias:'韩国职业联赛', goal:{combo:['0','2','4'],roi:5.4,cost:6}, half:{combo:['平平','平负','负负'],roi:16.2,cost:6} },
};
const GOAL_MIN_ROI = 15;
const HALF_MIN_ROI = 0;
const HALF_MAP = { hh:'胜胜',hd:'胜平',ha:'胜负',dh:'平胜',dd:'平平',da:'平负',ah:'负胜',ad:'负平',aa:'负负' };
const GOAL_KEYS = ['s0','s1','s2','s3','s4','s5','s6','s7'];
const GOAL_LABELS = ['0球','1球','2球','3球','4球','5球','6球','7+球'];

// ========== 数据获取 ==========
async function fetchMatches() {
  try {
    let allMatches = [];
    // 获取混合过关数据（包含hafu）
    const r1 = await fetch('https://webapi.sporttery.cn/gateway/uniform/football/getMatchCalculatorV1.qry?channel=c&poolCode=hafu');
    const d1 = await r1.json();
    if (!d1.success || !d1.value || !d1.value.matchInfoList) throw new Error('API异常');
    
    // 获取总进球数数据
    const r2 = await fetch('https://webapi.sporttery.cn/gateway/uniform/football/getMatchCalculatorV1.qry?channel=c&poolCode=ttg');
    const d2 = await r2.json();
    
    // 合并数据
    const ttgMap = {};
    if (d2.success && d2.value && d2.value.matchInfoList) {
      d2.value.matchInfoList.forEach(day => {
        (day.subMatchList || []).forEach(m => { ttgMap[m.matchId] = m.ttg; });
      });
    }
    
    let today = '';
    d1.value.matchInfoList.forEach(day => {
      if (!today) today = day.businessDate;
      (day.subMatchList || []).forEach(m => {
        if (m.matchStatus !== 'Selling') return;
        allMatches.push({
          id: m.matchId,
          date: m.matchDate || day.businessDate,
          time: (m.matchTime || '').substring(0,5),
          num: m.matchNumStr || '',
          league: m.leagueAbbName || '',
          leagueFull: m.leagueAllName || '',
          home: m.homeTeamAllName || '',
          away: m.awayTeamAllName || '',
          had: m.had || {},
          hafu: m.hafu || {},
          ttg: ttgMap[m.matchId] || m.ttg || {},
        });
      });
    });
    
    return { today, matches: allMatches };
  } catch(e) {
    console.error('获取数据失败:', e);
    return null;
  }
}

// ========== 联赛匹配 ==========
function findStrategy(leagueName, leagueFull) {
  // 精确匹配简称
  if (LEAGUE_MAP[leagueName]) return { name: leagueName, ...LEAGUE_MAP[leagueName] };
  // 全称匹配
  for (const [key, val] of Object.entries(LEAGUE_MAP)) {
    if (val.alias === leagueFull) return { name: key, ...val };
    if (leagueFull && leagueFull.includes(key)) return { name: key, ...val };
    if (leagueName && key.includes(leagueName)) return { name: key, ...val };
  }
  return null;
}

// ========== 渲染 ==========
function render(data) {
  const { today, matches } = data;
  document.getElementById('loadingView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
  document.getElementById('bottomBar').classList.remove('hidden');
  document.getElementById('todayDate').textContent = `📅 ${today} · 今日赛事`;
  document.getElementById('apiBadge').textContent = `✅ ${matches.length}场可售`;
  
  // 筛选
  const qualified = [];
  matches.forEach(m => {
    const strat = findStrategy(m.league, m.leagueFull);
    if (!strat) return;
    
    const goalOK = strat.goal.roi >= GOAL_MIN_ROI;
    const halfOK = strat.half.roi >= HALF_MIN_ROI;
    if (!goalOK && !halfOK) return;
    
    qualified.push({ ...m, strategy: strat, goalOK, halfOK });
  });
  
  // 统计
  let goalCount = 0, halfCount = 0, totalCost = 0;
  qualified.forEach(m => {
    if (m.goalOK) { goalCount++; totalCost += m.strategy.goal.cost; }
    if (m.halfOK) { halfCount++; totalCost += m.strategy.half.cost; }
  });
  
  document.getElementById('statCards').innerHTML = `
    <div class="stat-card"><div class="num gold">${qualified.length}</div><div class="lbl">可投赛事</div></div>
    <div class="stat-card"><div class="num green">${goalCount}</div><div class="lbl">总进球推荐</div></div>
    <div class="stat-card"><div class="num green">${halfCount}</div><div class="lbl">半全场推荐</div></div>
    <div class="stat-card"><div class="num red">¥${totalCost}</div><div class="lbl">合计投注</div></div>`;
  
  document.getElementById('totalCost').textContent = `¥${totalCost}`;
  
  // 空状态
  if (qualified.length === 0) {
    document.getElementById('emptyView').classList.remove('hidden');
    document.getElementById('matchList').innerHTML = '';
    document.getElementById('bottomBar').classList.add('hidden');
    return;
  }
  document.getElementById('emptyView').classList.add('hidden');
  
  // 渲染赛事列表
  let html = '';
  qualified.forEach(m => {
    const s = m.strategy;
    html += `<div class="match-card">
      <div class="m-header">
        <span class="m-league rec">${m.league}</span>
        <span class="m-num">${m.num} · ${m.time}</span>
      </div>
      <div class="m-teams">${m.home} <span class="vs">VS</span> ${m.away}</div>`;
    
    if (m.goalOK) {
      html += `<div class="bet-section">
        <div class="bs-title">🎯 总进球数 <span class="roi good">(ROI +${s.goal.roi}%)</span> → ${s.goal.cost}元</div>
        <div class="bet-options">`;
      s.goal.combo.forEach(opt => {
        const idx = parseInt(opt);
        const key = GOAL_KEYS[idx];
        const odds = m.ttg && m.ttg[key] ? m.ttg[key] : '?';
        html += `<span class="bet-opt rec">${GOAL_LABELS[idx]} @${odds}</span>`;
      });
      html += `</div></div>`;
    }
    
    if (m.halfOK) {
      html += `<div class="bet-section">
        <div class="bs-title">🎯 半全场 <span class="roi ${s.half.roi>=0?'good':'bad'}">(ROI ${s.half.roi>=0?'+':''}${s.half.roi}%)</span> → ${s.half.cost}元</div>
        <div class="bet-options">`;
      s.half.combo.forEach(opt => {
        const key = Object.keys(HALF_MAP).find(k => HALF_MAP[k] === opt);
        const odds = m.hafu && m.hafu[key] ? m.hafu[key] : '?';
        html += `<span class="bet-opt rec">${opt} @${odds}</span>`;
      });
      html += `</div></div>`;
    }
    
    html += `</div>`;
  });
  
  document.getElementById('matchList').innerHTML = html;
  
  // 存储数据供后续使用
  window._qualifiedMatches = qualified;
}

// ========== 投注方案 ==========
function showTicket() {
  const matches = window._qualifiedMatches || [];
  if (!matches.length) return;
  
  let totalCost = 0;
  let html = `<h3>🧾 今日AI投注方案</h3>
    <p style="font-size:12px;color:var(--sub);text-align:center;margin-bottom:12px;">
    ${matches[0].date} · 单关投注 · 直接发给体彩店出票</p>
    <div class="ticket">
      <div class="t-title">中国体育彩票 · AI智能推荐</div>`;
  
  // 按玩法分组
  let goalItems = [], halfItems = [];
  matches.forEach(m => {
    const s = m.strategy;
    if (m.goalOK) {
      let cost = s.goal.cost;
      totalCost += cost;
      const opts = s.goal.combo.map((o,i) => {
        const idx = parseInt(o);
        const odd = m.ttg && m.ttg[GOAL_KEYS[idx]] ? m.ttg[GOAL_KEYS[idx]] : '?';
        return `${GOAL_LABELS[idx]}@${odd}`;
      }).join(' / ');
      goalItems.push({ m, opts, cost });
    }
    if (m.halfOK) {
      let cost = s.half.cost;
      totalCost += cost;
      const opts = s.half.combo.map(o => {
        const key = Object.keys(HALF_MAP).find(k => HALF_MAP[k]===o);
        const odd = m.hafu && m.hafu[key] ? m.hafu[key] : '?';
        return `${o}@${odd}`;
      }).join(' / ');
      halfItems.push({ m, opts, cost });
    }
  });
  
  goalItems.forEach(item => {
    html += `<div class="t-item">
      <span>${item.m.league} ${item.m.home}vs${item.m.away} [总进球]</span>
      <span class="opts">${item.opts}</span>
      <span>¥${item.cost}</span></div>`;
  });
  halfItems.forEach(item => {
    html += `<div class="t-item">
      <span>${item.m.league} ${item.m.home}vs${item.m.away} [半全场]</span>
      <span class="opts">${item.opts}</span>
      <span>¥${item.cost}</span></div>`;
  });
  
  html += `<div class="t-total">合计: <strong>¥${totalCost}</strong></div>
    <p style="font-size:10px;color:var(--sub);margin-top:8px;line-height:1.5">
    ⚠️ 基于8联赛215场历史数据AI分析<br>投资有风险，请理性投注</p></div>`;
  
  // 过关选项
  if (matches.length >= 2) {
    html += `<div style="margin-top:12px">
      <p style="font-size:13px;font-weight:600;margin-bottom:8px;">🔗 过关投注（可选）</p>`;
    if (matches.length >= 2) {
      let parlayCost = 0;
      matches.forEach(m => { if(m.goalOK) parlayCost += m.strategy.goal.combo.length; });
      html += `<button onclick="showParlay(2)" style="margin:4px;padding:8px 16px;border:1px solid var(--red);border-radius:16px;background:#fff;color:var(--red);font-size:13px;font-weight:600;">2串1 · ${matches.length>=2?'可用':'不可用'}</button>`;
    }
    if (matches.length >= 3) {
      html += `<button onclick="showParlay(3)" style="margin:4px;padding:8px 16px;border:1px solid var(--red);border-radius:16px;background:#fff;color:var(--red);font-size:13px;font-weight:600;">3串1 · 可用</button>`;
    }
    html += `</div>`;
  }
  
  html += `<div class="btn-row" style="margin-top:16px">
    <button class="btn-close" onclick="closeTicket()">关闭</button>
    <button class="btn-print" onclick="copyTicket()">📋 复制投注方案</button>
  </div>`;
  
  document.getElementById('ticketContent').innerHTML = html;
  document.getElementById('ticketModal').classList.remove('hidden');
}

function showParlay(k) {
  const matches = window._qualifiedMatches || [];
  if (matches.length < k) return;
  
  // 每场比赛取总进球推荐的组合
  const combos = matches.filter(m => m.goalOK).slice(0, k);
  if (combos.length < k) { showToast('总进球数推荐赛事不足，无法组成该过关'); return; }
  
  // 笛卡尔积
  let totalCombos = 1, minOdds = Infinity, maxOdds = 0;
  let minCombo = '', maxCombo = '';
  
  const allOptionLists = combos.map(m => m.strategy.goal.combo);
  const total = allOptionLists.reduce((a,b) => a * b.length, 1);
  
  // 生成所有组合并计算
  function* cartesian(arrays, prefix=[]) {
    if (arrays.length === 0) { yield prefix; return; }
    for (const item of arrays[0]) {
      yield* cartesian(arrays.slice(1), [...prefix, item]);
    }
  }
  
  for (const combo of cartesian(allOptionLists)) {
    let prod = 1;
    let detail = [];
    combo.forEach((opt, i) => {
      const m = combos[i];
      const idx = parseInt(opt);
      const odd = parseFloat(m.ttg && m.ttg[GOAL_KEYS[idx]] ? m.ttg[GOAL_KEYS[idx]] : '3.5');
      prod *= odd;
      detail.push(`${m.home} ${GOAL_LABELS[idx]}@${odd}`);
    });
    const ret = prod * 2;
    if (ret < minOdds) { minOdds = ret; minCombo = detail.join(' × '); }
    if (ret > maxOdds) { maxOdds = ret; maxCombo = detail.join(' × '); }
  }
  
  const cost = total * 2;
  let html = `<h3>⚡ ${k}串1 过关计算</h3>
    <p style="font-size:12px;color:var(--sub);text-align:center;margin-bottom:12px">${combos.map(m=>m.home).join(' × ')}</p>
    <div class="ticket">
      <div class="t-title">总进球数 ${k}串1</div>`;
  
  combos.forEach(m => {
    const opts = m.strategy.goal.combo.map(o => {
      const idx = parseInt(o);
      const odd = m.ttg && m.ttg[GOAL_KEYS[idx]] ? m.ttg[GOAL_KEYS[idx]] : '?';
      return `${GOAL_LABELS[idx]}@${odd}`;
    }).join(' / ');
    html += `<div class="t-item"><span>${m.league} ${m.home}vs${m.away}</span><span class="opts">${opts}</span></div>`;
  });
  
  html += `<div class="t-item"><span>组合数</span><span>${total}注</span></div>
    <div class="t-item"><span>最低返奖</span><span style="color:var(--red)">¥${minOdds.toFixed(0)}</span></div>
    <div class="t-item"><span>最高返奖</span><span style="color:var(--green)">¥${maxOdds.toFixed(0)}</span></div>
    <div class="t-total">投注金额: <strong>¥${cost}</strong></div>
    <p style="font-size:10px;color:var(--sub);margin-top:4px">最差: ${minCombo}<br>最佳: ${maxCombo}</p></div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn-close" onclick="closeParlay()">关闭</button>
    </div>`;
  
  document.getElementById('parlayContent').innerHTML = html;
  document.getElementById('parlayModal').classList.remove('hidden');
}

function closeTicket() { document.getElementById('ticketModal').classList.add('hidden'); }
function closeParlay() { document.getElementById('parlayModal').classList.add('hidden'); }

function copyTicket() {
  const matches = window._qualifiedMatches || [];
  let text = '【AI智能投注方案】\n';
  text += `日期: ${matches[0]?.date || '今日'}\n`;
  text += '─'.repeat(30) + '\n';
  
  let total = 0;
  matches.forEach(m => {
    const s = m.strategy;
    if (m.goalOK) {
      total += s.goal.cost;
      const opts = s.goal.combo.map(o => `${o}球`).join('/');
      text += `${m.league} ${m.home}vs${m.away} 总进球:${opts} ¥${s.goal.cost}\n`;
    }
    if (m.halfOK) {
      total += s.half.cost;
      const opts = s.half.combo.join('/');
      text += `${m.league} ${m.home}vs${m.away} 半全场:${opts} ¥${s.half.cost}\n`;
    }
  });
  text += '─'.repeat(30) + '\n';
  text += `合计: ¥${total}\n`;
  text += '（AI基于8联赛215场历史数据生成）';
  
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('✅ 已复制！可直接发送给体彩店'));
  } else {
    showToast('请截图保存投注方案');
  }
}

document.getElementById('ticketModal').addEventListener('click', function(e) {
  if (e.target === this) closeTicket();
});
document.getElementById('parlayModal').addEventListener('click', function(e) {
  if (e.target === this) closeParlay();
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}

// ========== 启动 ==========
(async function() {
  const data = await fetchMatches();
  if (!data || !data.matches.length) {
    document.getElementById('loadingView').classList.add('hidden');
    document.getElementById('errorView').classList.remove('hidden');
    return;
  }
  render(data);
})();
</script>
