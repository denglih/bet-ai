<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<title>竞彩足球 2串1 一键生成</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #1a1d24;
    --sub: #6b7280;
    --line: #e6e8ec;
    --brand: #0a84ff;
    --brand-ink: #ffffff;
    --goals: #0a7d33;
    --half: #b45309;
    --ok: #0a7d33;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: 76px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 12px; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(135deg, #0a84ff, #0060df);
    color: #fff; padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: .9; }

  .toolbar {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin: 12px 0;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .toolbar .field { display: flex; align-items: center; gap: 6px; }
  .toolbar label { font-size: 13px; color: var(--sub); white-space: nowrap; }
  .toolbar input, .toolbar select {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 8px; font-size: 14px; background: #fff; color: var(--ink);
  }
  .toolbar input { width: 70px; }
  .toolbar select { max-width: 130px; }

  .btn {
    border: none; border-radius: 10px; padding: 10px 14px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--brand); color: var(--brand-ink);
  }
  .btn:active { opacity: .85; }
  .btn.secondary { background: #eef1f5; color: var(--ink); }
  .btn.block { width: 100%; }

  .status {
    border-radius: 12px; padding: 12px; margin: 12px 0;
    font-size: 14px; background: #fff; border: 1px solid var(--line);
  }
  .status.loading { color: var(--brand); }
  .status.error { color: var(--danger); background: #fef2f2; border-color: #fecaca; }
  .status.ok { color: var(--ok); }
  .status.empty { color: var(--sub); text-align: center; }

  .section-title {
    font-size: 15px; font-weight: 700; margin: 16px 0 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-title .cnt { font-weight: 500; font-size: 12px; color: var(--sub); }

  .match-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 10px;
  }
  .match-head { display: flex; align-items: center; gap: 8px; }
  .match-num { font-weight: 700; font-size: 14px; color: var(--brand); }
  .match-league {
    font-size: 12px; color: #fff; background: #334155;
    border-radius: 6px; padding: 2px 8px;
  }
  .match-time { margin-left: auto; font-size: 12px; color: var(--sub); }
  .match-teams { font-size: 15px; font-weight: 600; margin: 8px 0 2px; }
  .match-date { font-size: 12px; color: var(--sub); }

  .play-group { margin-top: 10px; }
  .play-label { font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .play-label.goals { color: var(--goals); font-weight: 600; }
  .play-label.half { color: var(--half); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 5px 10px; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip em { font-style: normal; color: var(--sub); font-size: 12px; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .chip.on em { color: rgba(255,255,255,.85); }

  .empty-mini { color: var(--sub); font-size: 13px; }

  .combo-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 10px;
  }
  .combo-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 3px 8px; color: #fff; }
  .badge.t1 { background: var(--goals); }
  .badge.t2 { background: #7c3aed; }
  .badge.t3 { background: #db2777; }
  .badge.t4 { background: var(--half); }
  .badge.profit { background: var(--ok); }
  .combo-idx { font-weight: 700; color: var(--sub); font-size: 13px; }
  .leg { border-left: 3px solid var(--line); padding: 4px 0 4px 10px; margin: 6px 0; }
  .leg.goals { border-left-color: var(--goals); }
  .leg.half { border-left-color: var(--half); }
  .leg .t { font-weight: 600; font-size: 14px; }
  .leg .p { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .leg .p b { color: var(--ink); font-weight: 600; }
  .leg .p .opt { color: #dc2626; font-weight: 700; }
  .combo-metrics {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line);
    font-size: 13px; color: var(--sub);
  }
  .combo-metrics b { color: var(--ink); font-weight: 700; }

  .floating {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #fff; border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 10px;
  }
  .floating .btn { flex: 1; }

  .note { font-size: 12px; color: var(--sub); margin: 12px 0; }
  .note-modal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.65);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: auto;
  }
  .note-modal-inner {
    background: #fff; border-radius: 12px; padding: 12px;
    max-width: 100%; max-height: 100%;
    display: flex; flex-direction: column; gap: 10px; align-items: stretch;
  }
  .note-modal-head { font-size: 14px; color: var(--ink); text-align: center; }
  .note-modal-inner img { width: 100%; height: auto; display: block; border-radius: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>竞彩足球 · 2串1 一键生成</h1>
  <p>同步体彩官方赛事与赔率 · 自动套用预设方案 · 手机出票助手</p>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="field">
      <label for="threshold">筛选值≥</label>
      <input id="threshold" type="number" min="0" max="200" step="1" value="20">
      <label for="threshold">%</label>
    </div>
    <div class="field">
      <label for="multiplier">倍数</label>
      <input id="multiplier" type="number" min="1" max="50" step="1" value="1">
    </div>
    <button class="btn" id="btnGen">生成方案</button>
    <button class="btn secondary" id="btnRefresh">刷新数据</button>
  </div>

  <div id="status" class="status loading">正在同步体彩数据…</div>

  <div class="section-title">当日赛事 <span class="cnt" id="matchCnt"></span></div>
  <div id="matches"></div>

  <div class="section-title">生成结果 <span class="cnt" id="resultCnt"></span></div>
  <div id="results"></div>

  <p class="note">说明：综合评分 = 两场命中率乘积（概率乘积，满分为100分，低于40分自动过滤）；总投入 = 总注数 × 2元。仅展示当日赛事（今日11:00至次日11:00开赛）。仅用于投注方案整理，不构成任何购彩建议。</p>
</div>

<div class="floating hidden" id="floatBar">
  <button class="btn" id="btnSave">保存注单图片</button>
  <button class="btn secondary" id="btnScrollTop">回顶部</button>
</div>

<div class="note-modal hidden" id="noteModal">
  <div class="note-modal-inner">
    <div class="note-modal-head">注单已生成 · 长按图片可保存到相册</div>
    <div id="noteImgBox"></div>
    <button class="btn" id="btnCloseModal">关闭</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- 玩法定义 ----------
  var GOAL_KEYS = ["s0","s1","s2","s3","s4","s5","s6","s7"];
  var GOAL_LABELS = ["0球","1球","2球","3球","4球","5球","6球","7+球"];
  var HALF_KEYS = ["hh","hd","ha","dh","dd","da","ah","ad","aa"];
  var HALF_LABELS = ["胜胜","胜平","胜负","平胜","平平","平负","负胜","负平","负负"];

  // ---------- 文档预设选择项（联赛短名 → 选项） ----------
  // ====AUTO:PRESET:START====
  var PRESET = {
    "挪超":   { goals: ["2球","3球","4球"], half: ["胜胜","平平","负负"] },
    "芬超":   { goals: ["2球","3球","4球"], half: ["胜胜","平胜","负负"] },
    "瑞超":   { goals: ["2球","3球","4球"], half: ["胜胜","平平","负负"] },
    "葡超":   { goals: ["2球","3球","4球"], half: ["胜胜","平平","负负"] },
    "西甲":   { goals: ["1球","2球","3球"], half: ["胜胜","平胜","负负"] },
    "荷甲":   { goals: ["2球","3球","4球"], half: ["胜胜","平平","负负"] },
    "荷乙":   { goals: ["2球","3球","4球"], half: ["胜胜","平平","负负"] },
    "法乙":   { goals: ["2球","3球","4球"], half: ["胜胜","平平","负负"] },
    "德乙":   { goals: ["1球","2球","3球"], half: ["胜胜","平平","负负"] },
    "欧冠":   { goals: ["1球","2球","3球"], half: ["胜胜","平胜","负负"] },
    "英冠":   { goals: ["1球","2球","3球"], half: ["胜胜","平平","负负"] },
    "巴甲":   { goals: ["2球","3球","4球"], half: ["胜胜","平平","负负"] },
    "美职":   { goals: ["2球","3球","4球"], half: ["胜胜","平胜","负负"] },
    "韩职":   { goals: ["1球","2球","3球"], half: ["胜胜","平平","负负"] },
    "日职":   { goals: ["2球","3球","4球"], half: ["胜胜","平平","负负"] },
    "日乙":   { goals: ["1球","2球","4球"], half: ["胜胜","负负","平平"] },
    "沙职":   { goals: ["2球","3球","4球"], half: ["胜胜","平胜","负负"] },
    "欧罗巴":  { goals: ["1球","2球","3球"], half: ["胜胜","平胜","负负"] },
    "英联赛杯": { goals: ["2球","3球","4球"], half: ["胜胜","平平","负负"] },
    "解放者杯": { goals: ["1球","2球","3球"], half: ["胜胜","平胜","平平"] },
    "亚冠精英": { goals: ["1球","2球","3球"], half: ["胜胜","平胜","平平"] },
  };
  // ====AUTO:PRESET:END====

  // ---------- 文档长期赔率（联赛短名 → 各玩法历史场均赔率） ----------
  // ====AUTO:LONG_ODDS:START====
  var LONG_ODDS = {
    "挪超":   { goals: 3.78, half: 3.32 },
    "芬超":   { goals: 3.84, half: 3.30 },
    "瑞超":   { goals: 3.69, half: 3.69 },
    "葡超":   { goals: 3.51, half: 2.95 },
    "西甲":   { goals: 3.58, half: 3.52 },
    "荷甲":   { goals: 3.91, half: 3.51 },
    "荷乙":   { goals: 3.75, half: 3.38 },
    "法乙":   { goals: 3.40, half: 3.92 },
    "德乙":   { goals: 3.73, half: 3.79 },
    "欧冠":   { goals: 3.74, half: 3.19 },
    "英冠":   { goals: 3.45, half: 4.14 },
    "巴甲":   { goals: 3.38, half: 3.81 },
    "美职":   { goals: 3.75, half: 3.43 },
    "韩职":   { goals: 3.55, half: 4.47 },
    "日职":   { goals: 3.66, half: 3.79 },
    "日乙":   { goals: 4.08, half: 3.83 },
    "沙职":   { goals: 3.83, half: 2.38 },
    "欧罗巴":  { goals: 3.61, half: 3.50 },
    "英联赛杯": { goals: 3.56, half: 3.29 },
    "解放者杯": { goals: 3.15, half: 4.13 },
    "亚冠精英": { goals: 3.77, half: 3.94 },
  };
  // ====AUTO:LONG_ODDS:END====

  // ---------- 文档命中率（联赛短名 → 各玩法所选选项历史命中率，概率 0~1） ----------
  // ====AUTO:HIT_RATE:START====
  var HIT_RATE = {
    "挪超":   { goals: 0.578, half: 0.659 },
    "芬超":   { goals: 0.604, half: 0.613 },
    "瑞超":   { goals: 0.645, half: 0.590 },
    "葡超":   { goals: 0.662, half: 0.641 },
    "西甲":   { goals: 0.703, half: 0.589 },
    "荷甲":   { goals: 0.647, half: 0.667 },
    "荷乙":   { goals: 0.596, half: 0.626 },
    "法乙":   { goals: 0.596, half: 0.632 },
    "德乙":   { goals: 0.673, half: 0.552 },
    "欧冠":   { goals: 0.555, half: 0.611 },
    "英冠":   { goals: 0.669, half: 0.564 },
    "巴甲":   { goals: 0.769, half: 0.513 },
    "美职":   { goals: 0.602, half: 0.615 },
    "韩职":   { goals: 0.637, half: 0.544 },
    "日职":   { goals: 0.667, half: 0.778 },
    "日乙":   { goals: 0.750, half: 0.750 },
    "沙职":   { goals: 0.634, half: 0.621 },
    "欧罗巴":  { goals: 0.663, half: 0.638 },
    "英联赛杯": { goals: 0.710, half: 0.645 },
    "解放者杯": { goals: 0.783, half: 0.630 },
    "亚冠精英": { goals: 0.595, half: 0.568 },
  };
  // ====AUTO:HIT_RATE:END====

  var API_URL = "https://webapi.sporttery.cn/gateway/jc/football/getMatchCalculatorV1.qry?poolCode=ttg,hafu&channel=c";

  var MATCHES = [];
  var LAST_UPDATE = "";
  var LAST_COMBOS = [];

  var $ = function (id) { return document.getElementById(id); };

  function parseOdds(v) {
    if (v === undefined || v === null || v === "") return null;
    var f = parseFloat(v);
    return (isFinite(f) && f > 0) ? f : null;
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function beijingNow() {
    var d = new Date();
    return new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 8 * 3600000);
  }

  function beijingDateStr(d) {
    return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
  }

  function buildOptions(pool, keys, labels) {
    if (!pool) return [];
    var out = [];
    for (var i = 0; i < keys.length; i++) {
      var odds = parseOdds(pool[keys[i]]);
      if (odds !== null) {
        out.push({ key: keys[i], label: labels[i], odds: odds, checked: false });
      }
    }
    return out;
  }

  function teamName(short, full) {
    return short || full || "";
  }

  function setStatus(cls, msg) {
    var el = $("status");
    el.className = "status " + cls;
    el.textContent = msg;
  }

  function loadData() {
    setStatus("loading", "正在同步体彩数据…");
    fetch(API_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data || data.success !== true) {
          throw new Error((data && data.errorMessage) || "接口返回异常");
        }
        parseData(data);
      })
      .catch(function (err) {
        setStatus("error", "数据同步失败：" + err.message + "（可点击“刷新数据”重试）");
        $("matches").innerHTML = "";
        $("results").innerHTML = "";
        $("matchCnt").textContent = "";
        $("resultCnt").textContent = "";
      });
  }

  function parseData(data) {
    var value = data.value || {};
    var list = [];
    var infoList = value.matchInfoList || [];
    var bjNow = beijingNow();
    var todayStr = beijingDateStr(bjNow);
    var tomorrowStr = beijingDateStr(new Date(bjNow.getTime() + 24 * 3600000));
    var windowStart = new Date(todayStr + "T11:00:00+08:00").getTime();
    var windowEnd = new Date(tomorrowStr + "T11:00:00+08:00").getTime();
    for (var i = 0; i < infoList.length; i++) {
      var subs = infoList[i].subMatchList || [];
      for (var j = 0; j < subs.length; j++) {
        var sm = subs[j];
        if (sm.matchStatus !== "Selling") continue;
        var kick = new Date((sm.matchDate || "") + "T" + (sm.matchTime || "") + "+08:00").getTime();
        if (!isFinite(kick) || kick < windowStart || kick >= windowEnd) continue;
        var goals = buildOptions(sm.ttg, GOAL_KEYS, GOAL_LABELS);
        var half = buildOptions(sm.hafu, HALF_KEYS, HALF_LABELS);
        if (goals.length === 0 && half.length === 0) continue;
        list.push({
          matchId: sm.matchId,
          matchNumStr: sm.matchNumStr || "",
          leagueAbbName: sm.leagueAbbName || "",
          leagueAllName: sm.leagueAllName || "",
          home: teamName(sm.homeTeamAbbName, sm.homeTeamAllName),
          away: teamName(sm.awayTeamAbbName, sm.awayTeamAllName),
          matchTime: sm.matchTime || "",
          matchDate: sm.matchDate || "",
          matchWeek: sm.matchWeek || "",
          goalsOptions: goals,
          halfOptions: half
        });
      }
    }
    MATCHES = list;
    LAST_UPDATE = value.lastUpdateTime || "";
    applyPresets();
    renderMatches();
    generate();
    setStatus("ok", "数据已同步" + (LAST_UPDATE ? "（更新时间 " + LAST_UPDATE + "）" : "") + "，共 " + MATCHES.length + " 场当日可投注赛事。");
  }

  function applyPresets() {
    for (var i = 0; i < MATCHES.length; i++) {
      var m = MATCHES[i];
      var p = PRESET[m.leagueAbbName];
      if (!p) continue;
      for (var a = 0; a < p.goals.length; a++) {
        var g = m.goalsOptions.filter(function (o) { return o.label === p.goals[a]; })[0];
        if (g) g.checked = true;
      }
      for (var b = 0; b < p.half.length; b++) {
        var h = m.halfOptions.filter(function (o) { return o.label === p.half[b]; })[0];
        if (h) h.checked = true;
      }
    }
  }

  function renderMatches() {
    var wrap = $("matches");
    $("matchCnt").textContent = MATCHES.length ? "共 " + MATCHES.length + " 场当日赛事" : "";
    if (!MATCHES.length) {
      wrap.innerHTML = '<div class="status empty">当日暂无可投注赛事（今日11:00至次日11:00）</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < MATCHES.length; i++) {
      var m = MATCHES[i];
      html += '<div class="match-card">';
      html += '  <div class="match-head">';
      html += '    <span class="match-num">' + esc(m.matchNumStr) + '</span>';
      html += '    <span class="match-league">' + esc(m.leagueAbbName || m.leagueAllName) + '</span>';
      html += '    <span class="match-time">' + esc(m.matchWeek + " " + m.matchTime) + '</span>';
      html += '  </div>';
      html += '  <div class="match-teams">' + esc(m.home) + ' vs ' + esc(m.away) + '</div>';
      html += '  <div class="match-date">' + esc(m.matchDate) + '</div>';

      html += '  <div class="play-group">';
      html += '    <div class="play-label goals">进球数（总进球）</div>';
      if (m.goalsOptions.length) {
        html += '    <div class="chips">' + renderChips(i, "goals", m.goalsOptions) + '</div>';
      } else {
        html += '    <div class="empty-mini">暂无此玩法</div>';
      }
      html += '  </div>';

      html += '  <div class="play-group">';
      html += '    <div class="play-label half">半全场</div>';
      if (m.halfOptions.length) {
        html += '    <div class="chips">' + renderChips(i, "half", m.halfOptions) + '</div>';
      } else {
        html += '    <div class="empty-mini">暂无此玩法</div>';
      }
      html += '  </div>';

      html += '</div>';
    }
    wrap.innerHTML = html;
  }

  function renderChips(mi, play, options) {
    var s = "";
    for (var k = 0; k < options.length; k++) {
      var o = options[k];
      s += '<button type="button" class="chip' + (o.checked ? ' on' : '') + '" data-mi="' + mi + '" data-play="' + play + '" data-key="' + o.key + '">'
        + esc(o.label) + ' <em>' + o.odds.toFixed(2) + '</em></button>';
    }
    return s;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // 事件委托：点击选项 chip 切换勾选
  $("matches").addEventListener("click", function (e) {
    var chip = e.target.closest ? e.target.closest(".chip") : null;
    if (!chip) return;
    var mi = parseInt(chip.getAttribute("data-mi"), 10);
    var play = chip.getAttribute("data-play");
    var key = chip.getAttribute("data-key");
    var m = MATCHES[mi];
    if (!m) return;
    var arr = play === "goals" ? m.goalsOptions : m.halfOptions;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].key === key) {
        arr[i].checked = !arr[i].checked;
        chip.classList.toggle("on", arr[i].checked);
        break;
      }
    }
  });

  function playName(play) {
    return play === "goals" ? "进球数（总进球）" : "半全场";
  }

  function typeOf(a, b) {
    if (a.play === "goals" && b.play === "goals") return { key: "t1", name: "进球数 × 进球数" };
    if (a.play === "goals" && b.play === "half") return { key: "t2", name: "进球数 × 半全场" };
    if (a.play === "half" && b.play === "goals") return { key: "t3", name: "半全场 × 进球数" };
    return { key: "t4", name: "半全场 × 半全场" };
  }

  function makeLeg(m, play, opts) {
    var sum = 0, min = Infinity, max = -Infinity;
    for (var i = 0; i < opts.length; i++) {
      sum += opts[i].odds;
      if (opts[i].odds < min) min = opts[i].odds;
      if (opts[i].odds > max) max = opts[i].odds;
    }
    var avg = sum / opts.length;
    var longOdds = avg;
    var lo = LONG_ODDS[m.leagueAbbName];
    if (lo) {
      var v = play === "goals" ? lo.goals : lo.half;
      if (v > 0) longOdds = v;
    }
    var hitRate = 0;
    var hr = HIT_RATE[m.leagueAbbName];
    if (hr) {
      var hv = play === "goals" ? hr.goals : hr.half;
      if (hv > 0) hitRate = hv;
    }
    return {
      matchId: m.matchId,
      matchNumStr: m.matchNumStr,
      home: m.home,
      away: m.away,
      league: m.leagueAbbName || m.leagueAllName,
      play: play,
      opts: opts,
      avg: avg,
      longOdds: longOdds,
      hitRate: hitRate,
      count: opts.length,
      min: min,
      max: max
    };
  }

  function generate() {
    var threshold = getThreshold();
    var multiplier = getMultiplier();
    var legs = [];
    for (var i = 0; i < MATCHES.length; i++) {
      var m = MATCHES[i];
      var gs = m.goalsOptions.filter(function (o) { return o.checked; });
      var hs = m.halfOptions.filter(function (o) { return o.checked; });
      if (gs.length) legs.push(makeLeg(m, "goals", gs));
      if (hs.length) legs.push(makeLeg(m, "half", hs));
    }

    var combos = [];
    for (var a = 0; a < legs.length; a++) {
      for (var b = a + 1; b < legs.length; b++) {
        if (legs[a].matchId === legs[b].matchId) continue; // 同一场比赛不能组成2串1
        var A = legs[a], B = legs[b];
        var product = A.longOdds * B.longOdds;
        var bets = A.count * B.count;
        var invest = bets * 2 * multiplier;
        var prize = 2 * product * multiplier;
        var profit = prize / invest - 1;
        var minPrize = 2 * A.min * B.min * multiplier;
        var maxPrize = 2 * A.max * B.max * multiplier;
        var prob = A.hitRate * B.hitRate;
        var score = prob * 100;
        var type = typeOf(A, B);
        combos.push({
          a: A, b: B,
          type: type,
          product: product,
          score: score,
          bets: bets,
          invest: invest,
          prize: prize,
          profit: profit,
          minPrize: minPrize,
          maxPrize: maxPrize,
          multiplier: multiplier
        });
      }
    }

    var filtered = combos.filter(function (c) { return c.profit >= threshold && c.score >= 40; });
    filtered.sort(function (x, y) {
      if (y.score !== x.score) return y.score - x.score;
      return y.product - x.product;
    });

    LAST_COMBOS = filtered;
    renderResults(filtered, combos.length, threshold);
  }

  function getThreshold() {
    var v = parseFloat($("threshold").value);
    if (!isFinite(v)) v = 20;
    if (v < 0) v = 0;
    return v / 100;
  }

  function getMultiplier() {
    var v = parseInt($("multiplier").value, 10);
    if (!isFinite(v) || v < 1) v = 1;
    if (v > 50) v = 50;
    return v;
  }

  function renderResults(combos, total, threshold) {
    var wrap = $("results");
    var pct = Math.round(threshold * 100);
    if (!combos.length) {
      $("resultCnt").textContent = "";
      wrap.innerHTML = '<div class="status empty">当日无可投注方案（无组合满足筛选值 ≥ ' + pct + '%）</div>';
      $("floatBar").classList.add("hidden");
      return;
    }
    $("resultCnt").textContent = "共 " + combos.length + " 个方案（已按筛选值 ≥ " + pct + "% 筛选）";
    var html = "";
    for (var i = 0; i < combos.length; i++) {
      html += renderCombo(i + 1, combos[i]);
    }
    wrap.innerHTML = html;
    $("floatBar").classList.remove("hidden");
  }

  function fmtScore(v) {
    var n = Math.round(v * 10) / 10;
    return (n % 1 === 0) ? String(n) : n.toFixed(1);
  }

  function renderCombo(idx, c) {
    var html = '<div class="combo-card">';
    html += '  <div class="combo-top">';
    html += '    <span class="combo-idx">#' + idx + '</span>';
    html += '    <span class="badge ' + c.type.key + '">' + esc(c.type.name) + '</span>';
    html += '    <span class="badge profit">综合评分 ' + fmtScore(c.score) + '分</span>';
    html += '  </div>';
    html += renderLeg("A", c.a);
    html += renderLeg("B", c.b);
    html += '  <div class="combo-metrics">';
    html += '    <div>过关方式：<b>2串1</b></div>';
    html += '    <div>注数×倍数：<b>' + c.bets + '×' + c.multiplier + '</b></div>';
    html += '    <div>合计：<b>' + c.invest.toFixed(0) + ' 元</b></div>';
    html += '    <div style="grid-column:1/-1">奖金区间：<b>最低 ' + c.minPrize.toFixed(2) + ' 元 ~ 最高 ' + c.maxPrize.toFixed(2) + ' 元</b></div>';
    html += '  </div>';
    html += '</div>';
    return html;
  }

  function renderLeg(tag, leg) {
    var opts = leg.opts.map(function (o) { return o.label + "(" + o.odds.toFixed(2) + ")"; }).join(" + ");
    var cls = leg.play === "goals" ? "goals" : "half";
    return '<div class="leg ' + cls + '">'
      + '<div class="t">' + tag + '. ' + esc(leg.matchNumStr) + ' ' + esc(leg.home) + ' vs ' + esc(leg.away) + '（' + esc(leg.league) + '）</div>'
      + '<div class="p"><b>' + playName(leg.play) + '</b> · <span class="opt">' + esc(opts) + '</span></div>'
      + '</div>';
  }

  function saveNoteImage() {
    if (!LAST_COMBOS.length) { toast("暂无方案可保存"); return; }

    var scale = 2;
    var W = 700, pad = 30, contentW = W - pad * 2, cx = pad;
    var F_TITLE = "bold 34px sans-serif";
    var F_HEAD  = "bold 28px sans-serif";
    var F_BODY  = "25px sans-serif";
    var F_BOLD  = "bold 25px sans-serif";
    var F_SMALL = "21px sans-serif";

    var lh = 36, titleH = 52, dividerH = 22;
    // 单页像素面积上限约 16M，避免超出部分浏览器（尤其 iOS/微信）超大 canvas 限制导致图片空白
    var MAX_AREA = 16777216;
    var MAX_H = Math.max(2000, Math.floor(MAX_AREA / (W * scale * scale)) - 120);

    var tmp = document.createElement("canvas").getContext("2d");
    var ops = [];

    function splitWrap(text, font) {
      tmp.font = font;
      var lines = [], cur = "";
      for (var i = 0; i < text.length; i++) {
        var t = cur + text[i];
        if (tmp.measureText(t).width > contentW && cur) { lines.push(cur); cur = text[i]; }
        else cur = t;
      }
      if (cur) lines.push(cur);
      return lines;
    }

    function wrap(text, color, font) {
      var ls = splitWrap(text, font);
      for (var i = 0; i < ls.length; i++) ops.push({ type: "line", text: ls[i], color: color, font: font });
    }
    function title(text) { ops.push({ type: "title", text: text, color: "#1a1d24", font: F_TITLE }); }
    function divider() { ops.push({ type: "divider" }); }

    function leg(tag, lg) {
      wrap(tag + ". " + lg.matchNumStr + " " + lg.home + " vs " + lg.away + "（" + lg.league + "）", "#1a1d24", F_BOLD);
      wrap("玩法：" + playName(lg.play), "#6b7280", F_BODY);
      wrap("选项：" + lg.opts.map(function (o) { return o.label + "(" + o.odds.toFixed(2) + ")"; }).join(" + "), "#dc2626", F_BOLD);
    }

    function comboOps(c, idx) {
      divider();
      wrap("【" + idx + "】" + c.type.name + "  综合评分：" + fmtScore(c.score) + "分", "#0a84ff", F_HEAD);
      wrap("过关方式 2×1  注数×倍数 " + c.bets + "×" + c.multiplier + "  合计 " + c.invest.toFixed(0) + "元", "#1a1d24", F_BOLD);
      leg("A", c.a);
      leg("B", c.b);
      wrap("奖金区间：最低 " + c.minPrize.toFixed(2) + " 元 ~ 最高 " + c.maxPrize.toFixed(2) + " 元", "#0a7d33", F_BOLD);
    }

    function headerOps(pageNo, pageTotal) {
      var pct = Math.round(getThreshold() * 100);
      var totalAmount = 0;
      for (var t = 0; t < LAST_COMBOS.length; t++) totalAmount += LAST_COMBOS[t].invest;
      title("竞彩足球 2串1 注单");
      wrap("数据时间：" + (LAST_UPDATE || "未知"), "#6b7280", F_SMALL);
      wrap("筛选值≥" + pct + "% · 倍数" + LAST_COMBOS[0].multiplier + " · 有效方案" + LAST_COMBOS.length + "个 · 总金额" + totalAmount.toFixed(0), "#6b7280", F_SMALL);
      if (pageTotal > 1) wrap("（第 " + pageNo + " / " + pageTotal + " 页）", "#6b7280", F_SMALL);
    }
    function footerOps() {
      divider();
      wrap("温馨提示：理性购彩，娱乐为主，仅供参考。", "#6b7280", F_SMALL);
    }

    function layoutHeight(arr) {
      var y = pad;
      for (var k = 0; k < arr.length; k++) {
        var op = arr[k];
        if (op.type === "title") y += titleH;
        else if (op.type === "divider") y += dividerH;
        else y += lh;
      }
      return y + pad;
    }

    function renderCanvas(arr) {
      var y = pad;
      for (var k = 0; k < arr.length; k++) {
        var op = arr[k];
        if (op.type === "title") { op.y = y + 30; y += titleH; }
        else if (op.type === "divider") { op.y = y + 6; y += dividerH; }
        else { op.y = y + 24; y += lh; }
      }
      var H = y + pad;
      var canvas = document.createElement("canvas");
      canvas.width = W * scale;
      canvas.height = Math.ceil(H) * scale;
      var ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, W, H);
      for (var m = 0; m < arr.length; m++) {
        var o = arr[m];
        if (o.type === "title") {
          ctx.fillStyle = o.color; ctx.font = o.font;
          var tw = ctx.measureText(o.text).width;
          ctx.fillText(o.text, (W - tw) / 2, o.y);
        } else if (o.type === "divider") {
          ctx.strokeStyle = "#e6e8ec"; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(cx, o.y); ctx.lineTo(W - pad, o.y); ctx.stroke();
        } else {
          ctx.fillStyle = o.color; ctx.font = o.font;
          ctx.fillText(o.text, cx, o.y);
        }
      }
      return canvas;
    }

    // 先构建每个组合的独立 op 块
    var blocks = [];
    for (var i = 0; i < LAST_COMBOS.length; i++) {
      ops = [];
      comboOps(LAST_COMBOS[i], i + 1);
      blocks.push({ ops: ops, h: layoutHeight(ops) });
    }
    ops = [];

    // 页头/页脚高度
    ops = [];
    headerOps(1, 1);
    var headerH = layoutHeight(ops);
    ops = [];
    footerOps();
    var footerH = layoutHeight(ops);
    ops = [];

    // 贪心分页
    var pageIndexes = [];
    var cur = [];
    var curH = headerH + footerH;
    for (var b = 0; b < blocks.length; b++) {
      if (cur.length && curH + blocks[b].h > MAX_H) {
        pageIndexes.push(cur);
        cur = [];
        curH = headerH + footerH;
      }
      cur.push(b);
      curH += blocks[b].h;
    }
    if (cur.length) pageIndexes.push(cur);

    // 逐页渲染
    var canvases = [];
    for (var p = 0; p < pageIndexes.length; p++) {
      ops = [];
      headerOps(p + 1, pageIndexes.length);
      for (var q = 0; q < pageIndexes[p].length; q++) {
        var bi = pageIndexes[p][q];
        for (var r = 0; r < blocks[bi].ops.length; r++) ops.push(blocks[bi].ops[r]);
      }
      footerOps();
      canvases.push(renderCanvas(ops));
    }
    ops = [];

    showNoteImages(canvases);
  }

  function showNoteImages(canvases) {
    var box = $("noteImgBox");
    box.innerHTML = "";
    var firstUrl = "";
    for (var i = 0; i < canvases.length; i++) {
      var url = canvases[i].toDataURL("image/png");
      if (i === 0) firstUrl = url;
      var img = document.createElement("img");
      img.src = url;
      img.alt = "注单图片 第 " + (i + 1) + " 页";
      box.appendChild(img);
    }
    var head = $("noteModal").querySelector(".note-modal-head");
    if (head) {
      head.textContent = canvases.length > 1
        ? "注单已生成 · 共 " + canvases.length + " 页 · 长按图片逐张保存"
        : "注单已生成 · 长按图片可保存到相册";
    }
    $("noteModal").classList.remove("hidden");

    if (firstUrl) {
      var a = document.createElement("a");
      a.href = firstUrl;
      a.download = "竞彩2串1注单_" + (LAST_UPDATE || "").replace(/[^\d]/g, "") + ".png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  }

  function toast(msg) {
    var el = $("status");
    el.className = "status ok";
    el.textContent = msg;
  }

  $("btnGen").addEventListener("click", function () { generate(); });
  $("btnRefresh").addEventListener("click", function () { loadData(); });
  $("threshold").addEventListener("change", function () { generate(); });
  $("multiplier").addEventListener("change", function () { generate(); });

  $("btnSave").addEventListener("click", function () { saveNoteImage(); });
  $("btnCloseModal").addEventListener("click", function () { $("noteModal").classList.add("hidden"); });

  $("btnScrollTop").addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });

  // 启动
  loadData();
})();
</script>
